name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Proves the app still bundles for a device, which typecheck alone
      # does not: a bad native module import only fails here.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir /tmp/export

      - name: Bundle for web
        run: npx expo export --platform web --output-dir /tmp/export-web
